name: GestOne Quality & CI Pipeline

permissions:
  contents: read

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm install --global npm@12.0.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/verify
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "mock_api_key"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "mock_auth_domain"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "mock_project_id"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "mock_storage_bucket"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "mock_sender_id"
          NEXT_PUBLIC_FIREBASE_APP_ID: "mock_app_id"
